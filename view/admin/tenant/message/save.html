{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; justify-content: center; font-size: 1.5em; margin-bottom: 20px;">{{header}}</div>
  <div style="display: flex; justify-content: center; align-items: center; height: 100%; ">
    <t-form ref="form" :data="formData" :rules="rules" :label-width="200" @submit="handleSave">
      <t-form-item label="入住日期" name="checkin_date">
        <t-date-picker v-model="formData.checkin_date" mode="date" :style="{ width: '480px' }" clearable />
      </t-form-item>
      <t-form-item label="姓名" name="name">
        <t-input v-model="formData.name" :style="{ width: '480px' }" placeholder="请输入" />
      </t-form-item>
      <t-form-item label="性别" name="sex">
        <t-radio-group v-model="formData.sex">
          <t-radio value="M">男</t-radio>
          <t-radio value="F">女</t-radio>
        </t-radio-group>
      </t-form-item>
      <t-form-item label="手机号码" name="phone">
        <t-input-number v-model="formData.phone" :style="{ width: '480px' }" theme="normal" placeholder="请输入" />
      </t-form-item>
      <t-form-item label="身份证号码" name="id_card_number">
        <t-input v-model="formData.id_card_number" :style="{ width: '480px' }" placeholder="请输入" />
      </t-form-item>
      <t-form-item label="籍贯" name="native_place">
        <t-input v-model="formData.native_place" :style="{ width: '480px' }" placeholder="请输入" />
      </t-form-item>
      <t-form-item label="工作单位" name="work_units">
        <t-input v-model="formData.work_units" :style="{ width: '480px' }" placeholder="请输入" />
      </t-form-item>
      <t-form-item label="备注" name="note">
        <t-textarea v-model="formData.note" :style="{ width: '480px' }" placeholder="请输入" autosize />
      </t-form-item>
      <t-form-item>
        <t-button variant="outline" @click="handleCancel" style="margin-right: 5px">取消</t-button>
        <t-button theme="primary" type="submit" :disabled="doubleClicking" style="margin-right: 5px">保存</t-button>
      </t-form-item>
    </t-form>
  </div>
</t-card>

{/block}

{block name="script"}
<script>
  const data = {
    formData: {},
    rules: {
      name: [{ required: true, message: '必填', trigger: 'blur' }],
      checkin_date: [{ required: true, message: '必填', trigger: 'blur' }],
      phone: [{ telnumber: true, message: '格式错误', trigger: 'blur' }],
      id_card_number: [{ idcard: true, message: '格式错误', trigger: 'blur' }],
    },
    // 避免重复点击
    doubleClicking: false,
    header: '房间',
    ymd: [],
    // 费用名称枚举值数组
    feeData: [],
  };

  function f() {
    return {
      init: function () {
        axiosGet("{:url('queryTenantEdit')}", { id: '{$id}', tenant_message_id: '{$tenant_message_id}' }).then(response => {
          if (response.code == 1) {
            this.formData = response.data;
            this.header = response.msg;
          } else {
            this.$message.error('系统出错');
          }
        });
      },
      handleCancel() {
        history.back();
      },
      handleSave() {
        this.doubleClicking = true;
        this.$refs.form.validate().then((valid) => {
          if (valid == true) {
            axiosPost("{:url('runSave')}", this.formData).then(response => {
              if (response.state == 'success') {
                this.$message.success(response.msg);
                location.href = "{:url('index')}";
              } else if (response.state == 'warning') {
                this.$message.warning(response.msg);
              } else {
                this.$message.error(response.msg);
              }
            }).finally(() => {
              this.doubleClicking = false;
            });
          } else {
            this.doubleClicking = false;
          }
        });
      },
    }
  }
</script>
{/block}
