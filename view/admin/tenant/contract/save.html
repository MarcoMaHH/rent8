{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; justify-content: center; font-size: 1.5em; margin-bottom: 20px;">{{header}}</div>
  <div style="display: flex; justify-content: center; align-items: center; height: 100%; ">
    <t-form ref="form" :data="formData" :rules="rules" :label-width="100" @submit="handleSave">
      <t-form-item label="租期" name="lease">
        <t-select v-model="formData.lease" clearable filterable :style="{ width: '480px' }" @change="handleChange">
          <t-option v-for="(item, index) in options" :key="index" :value="item.value" :label="item.label">
            {{ item.label }}
          </t-option>
        </t-select>
      </t-form-item>
      <t-form-item label="开始日期" name="start_date">
        <t-date-picker v-model="formData.start_date" mode="date" :style="{ width: '480px' }" clearable />
      </t-form-item>
      <t-form-item label="结束日期" name="end_date">
        <t-date-picker v-model="formData.end_date" mode="date" :style="{ width: '480px' }" clearable />
      </t-form-item>
      <t-form-item>
        <t-button variant="outline" @click="handleCancel" style="margin-right: 5px;">取消</t-button>
        <t-button theme="primary" type="submit" :disabled="doubleClicking">保存</t-button>
      </t-form-item>
    </t-form>
  </div>
</t-card>
{/block}

{block name="script"}
<script>
  const data = {
    formData: {},
    rules: {
      start_date: [{ required: true, message: "必填" }],
      end_date: [{ required: true, message: "必填" }],
    },
    // 避免重复点击
    doubleClicking: false,
    header: '合同信息',
    options: [
      { label: '1年', value: 1 },
      { label: '2年', value: 2 },
      { label: '3年', value: 3 },
      { label: '4年', value: 4 },
      { label: '5年', value: 5 },
    ],
  };

  function f() {
    return {
      init: function () {
        axiosGet("{:url('queryContractEdit')}", { id: '{$id}' }).then(response => {
          if (response.code == 1) {
            this.formData = response.data;
            this.header = response.msg;
            this.$refs.form.reset();
          } else {
            this.$message.error('系统出错了!!!');
          }
        });
      },
      handleCancel() {
        history.back();
      },
      handleSave() {
        this.doubleClicking = true;
        this.$refs.form.validate().then((valid) => {
          if (valid == true) {
            if (this.formData.end_date < this.formData.start_date) {
              this.$message.warning("结束日期不能小于开始日期");
              this.doubleClicking = false;
              return;
            }
            axiosPost("{:url('runSave')}", this.formData).then(response => {
              if (response.state == 'success') {
                this.$message.success(response.msg);
                location.href = "{:url('index')}";
              } else if (response.state == 'warning') {
                this.$message.warning(response.msg);
              } else {
                this.$message.error(response.msg);
              }
            }).finally(() => {
              this.doubleClicking = false;
            });
          } else {
            this.doubleClicking = false;
          }
        });
      },
      onNameChange(val) {
        this.formData.name_show = val;
      },
      handleChange(val) {
        if (val) {
          if (!this.formData.end_date) {
            let temp = new Date(this.formData.start_date);
            temp.setFullYear(temp.getFullYear() + val);
            this.formData.end_date = temp.toISOString().split('T')[0];
          } else {
            let startDate = new Date(this.formData.end_date);
            startDate.setDate(startDate.getDate() + 1);
            this.formData.start_date = startDate.toISOString().split('T')[0];

            let endDate = new Date(this.formData.end_date);
            endDate.setFullYear(endDate.getFullYear() + val);
            this.formData.end_date = endDate.toISOString().split('T')[0];
          }
        }
      }
    }
  }
</script>
{/block}
