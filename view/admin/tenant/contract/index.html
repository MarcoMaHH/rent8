{extend name="common/layout" /} {block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="margin-bottom: 10px; display: flex; align-items: center;">
    <div style="width: 280px; margin-right: 5px;">
      <t-input v-model="searchValue" placeholder="请输入房产、房间、租客" clearable @enter="handleSearch" />
    </div>
    <t-button theme="primary" @click="handleSearch">
      <template #icon><t-icon name="search" /></template>
    </t-button>
  </div>
  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :loading="tableLoading" :pagination="pagination">
    <template #state="{ row }">
      <t-tag v-if="row.type === 'N'" theme="danger" variant="light"> 退房 </t-tag>
      <t-tag v-if="row.type === 'Y'" theme="success" variant="light"> 在租 </t-tag>
    </template>
    <template #op="slotProps">
      <t-space>
        <t-button size="small" @click="handleEdit(slotProps.row)">修改</t-button>
        <t-button size="small" theme="default" @click="handleContract(slotProps.row)">下载合同</t-button>
        <t-button size="small" theme="warning" @click="handlePhoto(slotProps.row)">合同照片</t-button>
        <t-popconfirm theme="danger" content="确认删除?" @confirm="handleDelete(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="danger" size="small">删除</t-button>
        </t-popconfirm>
      </t-space>
    </template>
  </t-table>
</t-card>

{/block} {block name="script"}
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    columns: [
      { title: "房产名", colKey: "property_name", width: 80, fixed: "left" },
      { title: "房间名", colKey: "number_name", width: 80 },
      { title: "租客名", colKey: "tenant_name", width: 80 },
      { title: "租客状态", colKey: "state", width: 60 },
      { title: "开始日期", colKey: "start_date", width: 80 },
      {
        title: "结束日期",
        className: ({ row }) => {
          const endDate = new Date(row.end_date);
          const today = new Date();
          if (endDate <= today && row.type === 'Y') {
            return 'cell-red';
          }
          return '';
        },
        colKey: "end_date",
        width: 80
      },
      { title: "剩余天数", colKey: "remaining", width: 60 },
      { title: "操作", colKey: "op", width: 200, fixed: "right" },
    ],
    // 分页
    pagination: {
      defaultPageSize: 10,
      total: 10,
      defaultCurrent: 1,
    },
    // 搜索框
    searchValue: "",
    // 避免重复点击
    doubleClicking: false,
  };
  function f() {
    return {
      init: function () {
        this.queryTable();
      },
      queryTable: function () {
        this.tableLoading = true;
        axiosGet("{:url('queryContract')}", {
          parameter: this.searchValue,
        }).then((response) => {
          if (response.code == 1) {
            this.tableData = response.data;
            this.pagination.total = response.count;
          } else {
            this.$message.error("系统出错了!!!");
          }
          this.tableLoading = false;
        });
      },
      // 搜索
      handleSearch() {
        this.queryTable();
      },
      // 删除
      handleDelete(row) {
        if (this.doubleClicking) return;
        this.doubleClicking = true;
        axiosPost("{:url('delete')}", row).then((response) => {
          if (response.state == "success") {
            this.$message.success(response.msg);
            this.init();
          } else if (response.state == "warning") {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
      handleEdit(row) {
        location.href = "{:url('tenant.contract/save?id=')}" + row.id;
      },
      // 合同
      handleContract(row) {
        if (row.end_date) {
          axiosDownload("{:url('contract')}", { id: row.id })
            .then(() => {
              this.$message.success("开始下载合同");
            })
            .catch(() => {
              this.$message.error("下载失败");
            });
        } else {
          this.$message.warning("请先设置合同租期");
        }
      },
      // 合同照片
      handlePhoto(row) {
        location.href = "{:url('tenant.contract/photo?id=')}" + row.id;
      },
    };
  }
</script>
<style>
  td.cell-red {
    color: red;
  }

  td.cell-orange {
    color: orange;
  }
</style>
{/block}
