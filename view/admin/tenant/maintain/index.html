{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; align-items: center; margin-bottom: 10px;">
    <div style="display: flex; align-items: center; width: 350px; ">
      <div style="flex-grow: 1; margin-right: 5px;">
        <t-input v-model="searchValue" placeholder="请输入房产名、房间名" clearable @enter="handleSearch" />
      </div>
      <t-button theme="primary" @click="handleSearch">
        <template #icon><t-icon name="search" /></template>
      </t-button>
    </div>
  </div>

  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :loading="tableLoading" :pagination="pagination" @page-change="onPageChange">
    <template #status="{ row }">
      <t-tag v-if="row.status === 'Y'" theme="success" variant="light"> 已解决 </t-tag>
      <t-tag v-if="row.status === 'N'" theme="danger" variant="light"> 待解决 </t-tag>
    </template>
    <template #op="slotProps">
      <t-space>
        <t-button size="small" v-if="slotProps.row.status === 'N'" @click="handleEdit(slotProps.row)">处理</t-button>
        <t-popconfirm theme="danger" content="确认删除?" @confirm="handleDelete(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="danger" size="small">删除</t-button>
        </t-popconfirm>
      </t-space>
    </template>
  </t-table>
</t-card>
{/block}

{block name="script"}
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    columns: [
      { title: '房产名', colKey: 'property_name', width: 80, },
      { title: '房间名', colKey: 'number_name', width: 80, },
      { title: '说明', colKey: 'description', width: 250, },
      { title: '申请日期', colKey: 'request_time', width: 80 },
      { title: '状态', colKey: 'status', width: 50 },
      { title: '操作', colKey: 'op', width: 100, align: 'left' },
    ],
    house_number_id: '',
    // 搜索框
    searchValue: '',
    // 分页
    pagination: {
      defaultPageSize: 10,
      total: 10,
      defaultCurrent: 1,
      pageSize: 10,
    },
    // 避免重复点击
    doubleClicking: false,
  };
  function f() {
    return {
      init: function () {
        this.queryTable();
      },
      queryTable: function () {
        this.tableLoading = true;
        let params = {
          'parameter': this.searchValue,
          'limit': this.pagination.pageSize,
          'page': this.pagination.current
        };
        axiosGet("{:url('queryMaintain')}", params).then(response => {
          if (response.code == 1) {
            this.tableData = response.data;
            this.pagination.total = response.count;
            this.pagination.current = 1;
          } else {
            this.$message.error('系统出错了!!!');
          }
          this.tableLoading = false;
        });
      },
      onPageChange: function (pageInfo) {
        this.pagination.current = pageInfo.current;
        this.pagination.pageSize = pageInfo.pageSize;
        this.queryTable();
      },
      // 搜索
      handleSearch() {
        this.queryTable();
      },
      // 删除
      handleDelete(row) {
        if (this.doubleClicking) return;
        this.doubleClicking = true;
        axiosPost("{:url('delete')}", row).then((response) => {
          if (response.state == "success") {
            this.$message.success(response.msg);
            this.init();
          } else if (response.state == "warning") {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
      handleEdit(row) {
        location.href = "{:url('tenant.maintain/save?id=')}" + row.id;
      },
    }
  }
</script>

{/block}
