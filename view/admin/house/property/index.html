{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="margin-bottom: 10px;">
    <t-button theme="primary" @click="handleAdd">
      <template #icon><t-icon name="add" /></template>
      新增
    </t-button>
    <t-button theme="primary" @click="handleFees" style="margin-left: 10px">
      设置收费项目
    </t-button>
  </div>
  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :loading="tableLoading">
    <template #op="slotProps">
      <t-space>
        <t-button size="small" @click="handleEdit(slotProps.row)">修改</t-button>
        <t-popconfirm theme="danger" content="确认删除?" @confirm="handleDelete(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="danger" size="small">删除</t-button>
        </t-popconfirm>
      </t-space>
    </template>
  </t-table>
</t-card>
{/block}

{block name="script"}
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    columns: [
      { title: '房产名', colKey: 'name', width: 60, align: 'left', fixed: 'left', },
      { title: '房产展示名', colKey: 'name_show', width: 120 },
      { title: '详细地址', colKey: 'address', width: 250 },
      { title: '房东名称', colKey: 'landlord', width: 40 },
      { title: '房东手机', colKey: 'phone', width: 60 },
      { title: '房东身份证', colKey: 'id_card', width: 90 },
      { title: '操作', colKey: 'op', width: 120, align: 'left', fixed: 'right', },
    ],
    dialogVisible: false,
    // 避免重复点击
    doubleClicking: false,
  };

  function f() {
    return {
      init: function () {
        this.tableLoading = true;
        axiosGet("{:url('queryProperty')}").then(response => {
          if (response.code == 1) {
            this.tableData = response.data;
            this.queryHouse();
          } else {
            this.$message.error('系统出错了!!!');
          }
          this.tableLoading = false;
        });
      },
      handleAdd() {
        location.href = "{:url('house.property/save')}";
      },
      handleEdit(row) {
        location.href = "{:url('house.property/save?id=')}" + row.id;
      },
      handleDelete(row) {
        if (this.tableData.length == 1) {
          this.$message.warning('不能删除全部房产');
        } else {
          if (this.doubleClicking) return;
          this.doubleClicking = true;
          axiosPost("{:url('delete')}", row).then(response => {
            if (response.state == 'success') {
              this.$message.success(response.msg);
              this.init();
            } else if (response.state == 'warning') {
              this.$message.warning(response.msg);
            } else {
              this.$message.error(response.msg);
            }
            this.doubleClicking = false;
          });
        }
      },
      // 设置收费项目
      handleFees() {
        location.href = "{:url('house.fee/fees')}";
      },
    }
  }
</script>
{/block}
