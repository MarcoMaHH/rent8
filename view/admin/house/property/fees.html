{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; justify-content: center; font-size: 1.5em; margin-bottom: 20px;">{{header}}</div>
  <div v-for="(item, index) in tableData" :key="index"
    style="display: flex; justify-content: center; align-items: center;">
    <t-form-item :label="'项目' + (index + 1)" :name="item.column_id">
      <t-input v-model="item.column_name" :style="{ width: '400px' }" placeholder="请输入"
        :readonly="item.type == 'M' ? true : false" />
    </t-form-item>
  </div>
  <div style="display: flex; justify-content: center;">
    <t-button variant="outline" @click="handleCancel" style="margin-right: 5px;">取消</t-button>
    <t-button theme="primary" @click="handleSave" :disabled="doubleClicking">保存</t-button>
  </div>
</t-card>

{/block}

{block name="script"}
<script>
  const data = {
    tableData: [],
    // 避免重复点击
    doubleClicking: false,
    header: '设置收费项目',
  };

  function f() {
    return {
      init: function () {
        axiosGet("{:url('house.fee/queryFee')}").then(response => {
          if (response.code == 1) {
            this.tableData = response.data;
          } else {
            this.$message.error('系统出错了!!!');
          }
        });
      },
      handleCancel() {
        history.back();
      },
      handleSave() {
        this.doubleClicking = true;
        axiosPost("{:url('house.fee/saveFee')}", this.tableData).then(response => {
          if (response.state == 'success') {
            this.$message.success(response.msg);
            location.href = "{:url('house.property/index')}";
          } else if (response.state == 'warning') {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
      onNameChange(val) {
        this.formData.name_show = val;
      },
    }
  }
</script>
{/block}
