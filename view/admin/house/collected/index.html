{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; align-items: center; margin-bottom: 10px;">
    <div style="display: flex; align-items: center; width: 300px; ">
      <div style="flex-grow: 1; margin-right: 5px;">
        <t-input v-model="searchValue" placeholder="请输入房产、房间、租客" clearable @enter="handleSearch" />
      </div>
      <t-button theme="primary" @click="handleSearch">
        <template #icon><t-icon name="search" /></template>
      </t-button>
    </div>
    <div style="flex-grow: 1; text-align: center;">
      今日到账总金额：{{sum}} 元
    </div>
    <div style="margin-left: auto;">
      <t-button theme="primary" @click="handleFilter" style="margin-right: 10px;">
        <template #icon><t-icon name="unfold-more" /></template> 明细账单
      </t-button>
      <t-button theme="primary" @click="handleExport">
        <template #icon><t-icon name="file-export" /></template> 导出账单
      </t-button>
    </div>
  </div>

  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :loading="tableLoading" :pagination="pagination" @page-change="onPageChange">
    <template #bill_type="{ row }">
      <t-tag v-if="bill_type_array.find(i => i.value === row.bill_type)"
        :theme="bill_type_array.find(i => i.value === row.bill_type)?.note" variant="light">
        {{ bill_type_array.find(i => i.value === row.bill_type)?.label }}
      </t-tag>
    </template>
  </t-table>

  <!-- 导出FORM -->
  <t-dialog v-model:visible="dialogVisible" :header="formHeader" :width="680" :footer="false">
    <t-form ref="exportForm" :data="formData" :rules="rules" :label-width="100" @submit="handleExportSave">
      <t-form-item label="计算类别" name="type">
        <t-radio-group v-model="formData.type">
          <t-radio value="S">收款日期</t-radio>
          <t-radio value="A">到账日期</t-radio>
        </t-radio-group>
      </t-form-item>
      <t-form-item label="导出月份" name="export_time">
        <t-date-picker v-model="formData.export_time" mode="month" :style="{ width: '480px' }" clearable />
      </t-form-item>
      <t-form-item style="float: right">
        <t-button variant="outline" @click="dialogVisible = false" style="margin-right: 5px;">取消</t-button>
        <t-button theme="primary" type="submit" :disabled="doubleClicking">确定</t-button>
      </t-form-item>
    </t-form>
  </t-dialog>
</t-card>
{/block}

{block name="script"}
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    cloumnsFlag: false,
    columns: [],
    columns1: [],
    columns2: [],
    sum: 0,
    house_number_id: '',
    // 搜索框
    searchValue: '',
    // 分页
    pagination: {
      defaultPageSize: 10,
      total: 10,
      defaultCurrent: 1,
      pageSize: 10,
    },
    bill_type_array: [],
    // 导出表单数据
    formData: {},
    dialogVisible: false,
    formHeader: '导出账单',
    rules: {
      export_time: [{ required: true, message: "必填", trigger: "blur" }],
      type: [{ required: true, message: "必选", trigger: "blur" }],
    },
    // 避免重复点击
    doubleClicking: false,
  };
  function f() {
    return {
      init: function () {
        axiosGet("{:url('getColumns')}").then((response) => {
          if (response.code == 1) {
            this.columns = response.data[0];
            this.columns1 = response.data[0];
            this.columns2 = response.data[1];
          } else {
            console.log("getMessage error");
          }
        });
        this.queryTable();
        axiosGet("{:url('sum')}").then(response => {
          if (response.code == 1) {
            this.sum = response.msg;
          } else {
            this.$message.error('系统出错了!!!');
          }
        });
        axiosGet("{:url('admin.parameter/queryParameter')}", { parameter: 'bill_type' }).then(response => {
          if (response.code == 1) {
            this.bill_type_array = response.data;
          } else {
            console.error('账单类型参数获取失败');
          }
        });
      },
      queryTable: function () {
        this.tableLoading = true;
        let params = {
          'parameter': this.searchValue,
          'limit': this.pagination.pageSize,
          'page': this.pagination.current
        };
        axiosGet("{:url('queryCollected')}", params).then(response => {
          if (response.code == 1) {
            this.tableData = response.data;
            this.pagination.total = response.count;
            this.pagination.current = 1;
          } else {
            this.$message.error('系统出错了!!!');
          }
          this.tableLoading = false;
        });
      },
      onPageChange: function (pageInfo) {
        this.pagination.current = pageInfo.current;
        this.pagination.pageSize = pageInfo.pageSize;
        this.queryTable();
      },
      handleFilter: function () {
        if (this.cloumnsFlag) {
          this.isCollapse = false;
          this.columns = this.columns1;
        } else {
          this.isCollapse = true;
          this.columns = this.columns2;
        }
        this.cloumnsFlag = !this.cloumnsFlag;
      },
      // 搜索
      handleSearch() {
        this.queryTable();
      },
      // 导出excel
      handleExport() {
        this.$refs.exportForm.reset();
        this.formData = {
          type: 'A',
          export_time: new Date().toISOString().slice(0, 7)  // 格式为YYYY-MM
        };
        this.dialogVisible = true;
      },
      handleExportSave() {
        this.doubleClicking = true;
        this.$refs.exportForm.validate().then((valid) => {
          if (valid == true) {
            axiosDownload("{:url('export')}", this.formData);
            this.dialogVisible = false;
            this.doubleClicking = false;
          } else {
            this.doubleClicking = false;
          }
        });
      },
    }
  }
</script>

{/block}
