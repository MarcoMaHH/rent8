{extend name="common/layout" /}
{block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="margin-bottom: 10px;">
    <t-button theme="primary" style="margin-right: 10px;" @click="concentrated">
      集中抄表
    </t-button>
    <t-select placeholder="请选择抄表日期" clearable style="width: 150px;display: inline-block;" @change="changeDate">
      <t-option v-for="(item, index) in readingTimeArr" :key="index" :value="item.meter_reading_time"
        :label="item.meter_reading_time">
        {{ item.meter_reading_time }}
      </t-option>
    </t-select>
    <span style="float: right;">
      <t-button theme="primary" @click="handleFilter" style="margin-right: 10px;">
        <template #icon><t-icon name="unfold-more" /></template> 明细账单
      </t-button>
      <t-button theme="primary" @click="handlePrintAll">
        <template #icon><t-icon name="print" /></template> 打印列表
      </t-button>
    </span>
  </div>

  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :pagination="pagination" :loading="tableLoading" @sort-change="sortChange">
    <template #bill_type="{ row }">
      <t-tag v-if="bill_type_array.find(i => i.value === row.bill_type)"
        :theme="bill_type_array.find(i => i.value === row.bill_type)?.note" variant="light">
        {{ bill_type_array.find(i => i.value === row.bill_type)?.label }}
      </t-tag>
    </template>
    <template #op="slotProps">
      <t-space>
        <t-button size="small" @click="handleEdit(slotProps.row)">抄表</t-button>
        <t-button size="small" v-if="slotProps.row.bill_type != 'B'" theme="success"
          @click="handlePrint(slotProps.row)">收据</t-button>
        <t-popconfirm theme="danger" content="确认到账?" @confirm="handleAccount(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="warning" size="small">到账</t-button>
        </t-popconfirm>
        <t-popconfirm v-if="slotProps.row.end_time != null" theme="danger" content="确认延期?"
          @confirm="handleBalance(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="danger" size="small">延期</t-button>
        </t-popconfirm>
      </t-space>
    </template>
  </t-table>
</t-card>

<!-- 查看收据 -->
{include file="house/uncollected/printReceipt" /}
<!-- 打印table -->
{include file="house/uncollected/printTable" /}
{/block}

{block name="script"}
<link rel="stylesheet" href="__STATIC__/css/receipt.css" type="text/css">
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    // 分页
    pagination: {
      defaultPageSize: 20,
      total: 10,
      defaultCurrent: 1,
      pageSizeOptions: [20, 50],
    },
    // 排序
    order: '',
    field: '',
    readingTimeArr: [],
    readingTime: '',
    // 收据
    formData: {},
    receiptVisible: false,
    historyColumns: [
      { title: '租期', colKey: 'start_time', width: 70, },
      { title: '用电量', colKey: 'electricity_consumption', width: 50, },
      { title: '用水量', colKey: 'water_consumption', width: 50 },
      { title: '备注', colKey: 'note', width: 100, ellipsis: true },
    ],
    historyData: [],
    titleItem: [],
    // 明显账单
    cloumnsFlag: false,
    columns: [],
    columns1: [
      { title: '序号', colKey: 'serial-number', width: 30, },
      { title: '账单类型', colKey: 'bill_type', width: 60, },
      { title: '房产名', colKey: 'property_name', width: 80, },
      { title: '房间名', colKey: 'number_name', width: 80, sorter: true },
      { title: '总金额', colKey: 'total_money', width: 80, },
      { title: '收款日期', colKey: 'start_time', width: 80 },
      { title: '抄表日期', colKey: 'meter_reading_time', width: 80 },
      { title: '操作', colKey: 'op', width: 150, align: 'left' },
    ],
    columns2: [],
    // 避免重复点击
    doubleClicking: false,
    // 账单类型标签
    bill_type_array: [],
    columnsArr: [],
  }
  function f() {
    return {
      init: function () {
        this.columns = this.columns1;
        this.queryTable();
        this.queryReadingTime();
        axiosGet("{:url('admin.parameter/queryParameter')}", { parameter: 'bill_type' }).then(response => {
          if (response.code == 1) {
            this.bill_type_array = response.data;
          } else {
            console.error('账单类型参数获取失败');
          }
        });
        axiosGet("{:url('getColumns')}").then((response) => {
          if (response.code == 1) {
            this.columnsArr = response.data;
            const dynamicColumns = this.columnsArr.map(item => ({
              title: item.column_name,
              colKey: item.column_id,
              width: 50
            }));

            this.columns2 = [
              { title: '序号', colKey: 'serial-number', width: '30px' },
              { title: '账单类型', colKey: 'bill_type', width: '55px' },
              { title: '房产名', colKey: 'property_name', width: '80px' },
              { title: '房间名', colKey: 'number_name', width: '80px', sorter: true },
              { title: '电表度数', colKey: 'electricity_meter_this_month', width: '70px' },
              { title: '用电量', colKey: 'electricity_consumption', width: '60px' },
              { title: '电费', colKey: 'electricity', width: '60px' },
              { title: '水表度数', colKey: 'water_meter_this_month', width: '70px' },
              { title: '用水量', colKey: 'water_consumption', width: '60px' },
              { title: '水费', colKey: 'water', width: '50px' },
              { title: '租金', colKey: 'rental', width: '50px' },
              { title: '押金', colKey: 'deposit', width: '50px' },
              ...dynamicColumns,
              { title: '总金额', colKey: 'total_money', width: '59px' },
              { title: '备注', colKey: 'note', width: '100px', ellipsis: true },
              { title: '收款日期', colKey: 'start_time', width: '80px' }
            ];
          } else {
            console.log("getMessage error");
          }
        });
      },
      // 查询抄表日期
      queryReadingTime: function () {
        axiosGet("{:url('queryReadingTime')}").then(response => {
          if (response.code == 1) {
            this.readingTimeArr = response.data;
          } else {
            console.error('查询抄表日期失败!!!');
          }
        });
      },
      queryTable: function () {
        this.tableLoading = true;
        axiosGet("{:url('queryUncollected')}", { 'order': this.order, 'field': this.field, 'meter_reading_time': this.readingTime })
          .then(response => {
            if (response.code == 1) {
              this.tableData = response.data;
              this.pagination.total = response.count;
            } else {
              this.$message.error('系统出错了!!!');
            }
            this.tableLoading = false;
          });
      },
      // 排序
      sortChange: function (val) {
        if (val) {
          this.order = 'asc';
          if (val.descending) {
            this.order = 'desc';
          }
          this.field = val.sortBy;
        } else {
          this.order = '';
          this.field = '';
        }
        this.queryTable();
      },
      // 切换抄表日期查询
      changeDate(val) {
        this.readingTime = val;
        this.queryTable();
      },

      // 抄表
      handleEdit(row) {
        location.href = "{:url('house.uncollected/save')}?house_property_id=" + this.houseDef + "&id=" + row.id;
      },
      // 查看收据
      handlePrint(row) {
        this.receiptVisible = true;
        this.formData = { ...row };
        this.titleItem = [];
        if (row['rental']) this.titleItem.push({ 'label': '租金', 'value': row['rental'] });
        if (row['deposit']) this.titleItem.push({ 'label': '押金', 'value': row['deposit'] });
        const dynamicColumns = this.columnsArr.map(item => {
          if (row[item.column_id]) {
            this.titleItem.push({ 'label': item.column_name, 'value': row[item.column_id] });
          }
          return null;
        }).filter(Boolean);

        // 查询历史账单数据
        axiosGet("{:url('queryHistory')}", { number_id: row.house_number_id }).then(response => {
          if (response.code == 1) {
            this.historyData = response.data;
          } else {
            this.$message.error('查询历史账单数据失败!!!');
          }
        });
      },
      // 收据打印
      handlePrintReceipt() {
        printJS({
          printable: 'printJS-form333',
          type: 'html',
          css: '__STATIC__/css/receipt_print.css',
        })
      },
      // 到账
      handleAccount(row) {
        if (this.doubleClicking) return;
        this.doubleClicking = true;
        axiosPost("{:url('account')}", { id: row.id }).then(response => {
          if (response.state == 'success') {
            this.$message.success(response.msg);
            this.queryTable();
            this.queryReadingTime();
          } else if (response.state == 'warning') {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
      // 打印table
      handlePrintAll() {
        printJS({
          printable: 'printTable',
          type: 'html',
          header: '打印时间：' + new Date().toLocaleDateString(),
          headerStyle: 'font-weight: 100; font-size: 12px;',
          css: '__STATIC__/css/table.css',
        })
      },
      // 延期
      handleBalance(row) {
        if (this.doubleClicking) return;
        this.doubleClicking = true;
        axiosPost("{:url('balance')}", { id: row.id }).then(response => {
          if (response.state == 'success') {
            this.$message.success(response.msg);
            this.queryTable();
          } else if (response.state == 'warning') {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
      // 集中抄表
      concentrated() {
        location.href = "{:url('house.uncollected/centralized')}";
      },

      // 明细账单
      handleFilter: function () {
        if (this.cloumnsFlag) {
          this.isCollapse = false;
          this.columns = this.columns1;
        } else {
          this.isCollapse = true;
          this.columns = this.columns2;
        }
        this.cloumnsFlag = !this.cloumnsFlag;
      },
    }
  }
</script>
{/block}
