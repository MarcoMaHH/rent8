{extend name="common/layout" /} {block name="main"}
<t-card class="list-card-container" :bordered="false">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
    <t-button theme="primary" @click="handleAddMore" :disabled="buttonDisabled">
      <template #icon><t-icon name="add" /></template>
      新增
    </t-button>
    <div style="display: flex; align-items: center; width: 280px; margin-left: 10px;">
      <div style="flex-grow: 1; margin-right: 5px">
        <t-input v-model="searchValue" placeholder="请输入房产名、房间名" clearable @enter="handleSearch" />
      </div>
      <t-button theme="primary" @click="handleSearch">
        <template #icon><t-icon name="search" /></template>
      </t-button>
    </div>
    <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
      已租房间: {{numberMessage.rented}}, 空闲房间: {{numberMessage.empty}}, 入住率: {{numberMessage.occupancy}}
    </div>
  </div>

  <t-table :data="tableData" :columns="columns" row-key="id" vertical-align="top" :bordered="true" size="small"
    active-row-type="single" :hover="true" :pagination="pagination" :loading="tableLoading">
    <template #state="{ row }">
      <t-tag v-if="row.checkin_date !== null" theme="danger" variant="light">
        已租
      </t-tag>
      <t-tag v-if="row.checkin_date === null" theme="success" variant="light">
        空闲
      </t-tag>
    </template>
    <template #op="slotProps">
      <t-space>
        <t-button size="small" @click="handleEdit(slotProps.row)">修改</t-button>
        <t-button size="small" theme="success" v-if="slotProps.row.checkin_date === null"
          @click="handleCheckIn(slotProps.row)">入住</t-button>
        <t-button size="small" theme="warning" v-if="slotProps.row.checkin_date !== null"
          @click="handleCheckOut(slotProps.row)">退房</t-button>
        <t-popconfirm theme="danger" content="确认删除?" @confirm="handleDelete(slotProps.row)" :disabled="doubleClicking">
          <t-button theme="danger" size="small">删除</t-button>
        </t-popconfirm>
      </t-space>
    </template>
  </t-table>
</t-card>
{/block}

{block name="script"}
<script>
  const data = {
    tableData: [],
    tableLoading: false,
    // 分页
    pagination: {
      defaultPageSize: 10,
      total: 10,
      defaultCurrent: 1,
    },
    columns: [
      { title: "房产名", colKey: "property_name", width: 80, align: "left", fixed: "left", },
      { title: "房间名", colKey: "name", width: 80 },
      { title: "房间状态", colKey: "state", width: 80 },
      { title: "收款日期", colKey: "payment_date", width: 80 },
      { title: "收款周期", colKey: "cycle_name", width: 80 },
      { title: "房租", colKey: "rental", width: 80 },
      { title: "押金", colKey: "deposit", width: 80 },
      { title: "入住日期", colKey: "checkin_date", width: 80 },
      { title: "闲置天数", colKey: "idle", width: 80 },
      { title: "操作", colKey: "op", width: 160, align: "left", fixed: "right", },
    ],
    // 搜索
    searchValue: "",
    numberMessage: {},
    // 避免重复点击
    doubleClicking: false,
  };
  function f() {
    return {
      init: function () {
        this.tableLoading = true;
        axiosGet("{:url('queryNumber')}", { parameter: this.searchValue })
          .then((response) => {
            if (response.code == 1) {
              this.tableData = response.data;
              this.pagination.total = response.count;
            } else {
              this.$message.error("系统出错");
            }
            this.tableLoading = false;
          });
        axiosGet("{:url('getNumberMessage')}")
          .then((response) => {
            if (response.code == 1) {
              this.numberMessage = response.data;
            } else {
              console.log("getMessage error");
            }
          });
      },
      // 查询
      handleSearch() {
        this.init();
      },
      // 修改
      handleEdit(row) {
        location.href = "{:url('house.number/save')}?id=" + row.id;
      },
      // 批量新增
      handleAddMore() {
        if (!this.houseDef) {
          this.$message.warning("请先新增房产");
        } else {
          location.href = "{:url('house.number/increase')}?house_property_id=" + this.houseDef;
        }
      },
      // 入住
      handleCheckIn(row) {
        location.href = "{:url('house.number/checkin')}?id=" + row.id;
      },
      // 退房
      handleCheckOut(row) {
        location.href = "{:url('house.number/checkout')}?id=" + row.id;
      },
      // 删除
      handleDelete(row) {
        if (this.doubleClicking) return;
        this.doubleClicking = true;
        axiosPost("{:url('delete')}", row).then((response) => {
          if (response.state == "success") {
            this.$message.success(response.msg);
            this.init();
          } else if (response.state == "warning") {
            this.$message.warning(response.msg);
          } else {
            this.$message.error(response.msg);
          }
        }).finally(() => {
          this.doubleClicking = false;
        });
      },
    };
  }
</script>
{/block}
